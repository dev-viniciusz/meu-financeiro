server.port=${PORT:8080}

# Banco (PostgreSQL). Em produção, defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4

# Roda o schema.sql ao iniciar (cria as tabelas se ainda não existirem)
spring.sql.init.mode=always

# Domínio do front que pode chamar a API (CORS)
app.allowed-origin=${ALLOWED_ORIGIN:*}

spring.main.banner-mode=off
