<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Histórico | Meu Financeiro</title>
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/app.css" />
        <link rel="icon" type="image/x-icon" href="../assets/logo/favicon.ico">
    </head>
    <body data-page="history">
        <div class="app-layout">
            <div id="sidebar-slot"></div>
            <button
                class="sidebar-backdrop"
                id="sidebar-backdrop"
                type="button"
                aria-label="Fechar menu"
                hidden
            ></button>
            <main class="app-main">
                <header class="mobile-header">
                    <button
                        class="menu-toggle"
                        id="menu-toggle"
                        type="button"
                        aria-label="Abrir menu"
                        aria-controls="app-sidebar"
                        aria-expanded="false"
                    >
                        ☰</button
                    ><span class="mobile-brand">Meu Financeiro</span>
                </header>
                <header class="page-heading page-title-row">
                    <div>
                        <h1>Histórico</h1>
                        <p>Consulte suas movimentações por mês e ano.</p>
                    </div>
                    <div class="filter-row">
                        <label class="filter-control"
                            >Mês<select id="history-month">
                                <option value="1">Janeiro</option>
                                <option value="2">Fevereiro</option>
                                <option value="3">Março</option>
                                <option value="4">Abril</option>
                                <option value="5">Maio</option>
                                <option value="6">Junho</option>
                                <option value="7">Julho</option>
                                <option value="8">Agosto</option>
                                <option value="9">Setembro</option>
                                <option value="10">Outubro</option>
                                <option value="11">Novembro</option>
                                <option value="12">Dezembro</option>
                            </select></label
                        >
                        <label class="filter-control"
                            >Ano<select id="history-year"></select></label
                        ><button
                            class="primary-button"
                            id="apply-filter"
                            type="button"
                        >
                            Filtrar
                        </button>
                    </div>
                </header>
                <section class="panel records-panel">
                    <header class="panel-heading">
                        <div>
                            <h2 id="history-heading">Movimentações</h2>
                            <p>Entradas e despesas do período selecionado</p>
                        </div>
                        <strong id="history-total"></strong>
                    </header>
                    <div
                        class="record-list"
                        id="history-list"
                        aria-live="polite"
                    ></div>
                </section>
            </main>
        </div>
        <script src="../js/api.js"></script>
        <script src="../js/finance-store.js"></script>
        <script src="../js/app-shell.js"></script>
        <script src="../js/history.js"></script>
    </body>
</html>
